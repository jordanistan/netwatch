version: '3.8'

services:
  netwatch:
    build:
      context: .
    privileged: true
    container_name: netwatch
    network_mode: host
    # When using host network mode, port mappings are not needed
    # as the container uses the host's network directly
    volumes:
      - ./captures:/app/captures
      - ./logs:/app/logs
      - ./reports:/app/reports
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    environment:
      - STREAMLIT_SERVER_PORT=8502
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    logging:
      driver: json-file
      # yamllint disable quotes
      options:
        max-size: "10m"
        max-file: "3"
      # yamllint enable quotes